org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 机器专属的 JVM 配置（org.gradle.java.home / org.gradle.java.installations.paths）不要写在这里：
# 它们随开发者机器而异，入库会让 CI 与其它克隆在 Gradle 启动时即失败。
# 如需固定本机 daemon JVM，请写到 GRADLE_USER_HOME/gradle.properties（不入库）。
# core-geo 的 jvmToolchain(17) 由 settings.gradle.kts 的 foojay-resolver 自动 provisioning。
android.useAndroidX=true
# 工程目录含中文（0_archive/乐跑），AGP 默认拒绝构建；仅关闭路径检查，不影响产物
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false

# 单一版本号来源：:app 和 :app-ui 都从这里读取，避免多模块拆分后版本号各写一份、逐渐漂移
APP_VERSION_CODE=30000
APP_VERSION_NAME=3.0.0
